<!DOCTYPE html>
<html data-bs-theme="dark">
	<head>
        	<title>{{.User.Username}}'s Profile</title>
	</head>
	<body>
		{{ template "Header" . }}
		<div class="container my-4">
			<div class="row g-4">
				<div class="col-md-6 col-lg-4">
					<div class="card bg-dark text-white h-100 shadow">
						<div class="card-header">
							<h5 class="mb-0">Account Details</h5>
						</div>
						<div class="card-body">
							<p><i class="bi bi-person-circle"></i> {{.User.Username}}</p>
							<p><i class="bi bi-envelope"></i> {{.User.Email}}</p>
							<p><i class="bi bi-calendar-check"></i> {{.User.CreatedAt.Format "Jan 2, 2006"}}</p>
						</div>
						<div class="card-footer d-flex justify-content-end gap-2">
							<button class="btn btn-outline-light btn-sm">
								Edit
							</button>
							<form method="POST" action="/logout" class="m-0">
								<button type="submit" class="btn btn-secondary btn-sm">
									Logout
								</button>
							</form>
						</div>
					</div>
				</div>
				<div class="col-lg-8">
					<div class="card card bg-dark text-white h-100 shadow">
						<div class="card-header">
							<h5 class="mb-0">Notes</h5>
						</div>
						<div class="card-body">
							<div class="mb-4">
								<button
									class="btn btn-success btn-sm w-100"
									data-bs-toggle="modal"
									data-bs-target="#addNoteModal">
									<i class="bi bi-plus-circle-fill"></i>
								</button>
							</div>
							<div class="row g-4">
								{{ range .Notes }}
								<div class="col-md-4">
									<div class="card bg-dark text-white h-100 shadow">
										<div class="card-body">
											<p> {{ .Message }} </p>
										</div>
										<div class="card-footer text-end">
											<button 
												class="btn btn-outline-light btn-sm"
												data-bs-toggle="modal"
												data-bs-target="#editNoteModal"
												data-id="{{ .ID }}"
												data-message="{{ .Message }}">
												Edit
											</button>
											<button 
												class="btn btn-danger btn-sm"
												data-bs-toggle="modal"
												data-bs-target="#deleteNoteModal"
												data-id="{{ .ID }}"
												data-message="{{ .Message }}">
												Delete
											</button>
										</div>
									</div>
								</div>
								{{ end }}
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<div class="modal fade" id="addNoteModal" tabindex="-1" aria-labelledby="addNoteModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content bg-dark text-white">
					
					<div class="modal-header">
						<h5 class="modal-title" id="addNoteModalLabel">Add Note</h5>
						<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
					</div>

					<form action="/note-add" method="POST">
						
						<div class="modal-body">
							<div class="mb-3">
								<label for="noteText" class="form-label">Message</label>
								<textarea class="form-control" id="noteText" name="noteText" placeholder="Write text here" rows="3" maxlength="280" required></textarea>
							</div>
						</div>

						<div class="modal-footer">
							<button
								type="button"
								class="btn btn-secondary"
								data-bs-dismiss="modal">
								Cancel
							</button>

							<button
								type="submit"
								class="btn btn-success">
								Save Note
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<div class="modal fade" id="editNoteModal" tabindex="-1">
			<div class="modal-dialog">
				<div class="modal-content bg-dark text-white">
					<div class="modal-header">
						<h5 class="modal-title">Edit Note</h5>
						<button 
							type="button"
							class="btn-close btn-close-white"
							data-bs-dismiss="modal">
						</button>
					</div>
					<form action="/note-edit" method="POST">
						<input type="hidden" id="edit-note-id" name="id">
						<div class="modal-body">
							<div class="mb-3">
								<!-- <label class="form-label">Message</label> -->
								<textarea class="form-control" id="edit-note-message" name="message" rows="3" maxlength="280" required></textarea>
							</div>
						</div>
						<div class="modal-footer">
							<button
								type="button"
								class="btn btn-secondary"
								data-bs-dismiss="modal">
								Cancel
							</button>
							<button
								type="submit"
								class="btn btn-success">
								Save Changes
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<div class="modal fade" id="deleteNoteModal" tabindex="-1" aria-labelledby="deleteNoteModalLabel" aria-hidden="true">
			<div class="modal-dialog">
				<div class="modal-content bg-dark text-white">
					<div class="modal-header">
						<h5 class="modal-title" id="deleteNoteModalLabel">Delete Note</h5>
						<button
							type="button"
							class="btn-close btn-close-white"
							data-bs-dismiss="modal">
						</button>
					</div>
					<form action="/note-delete" method="POST">
						<input type="hidden" id="delete-note-id" name="id">
						<div class="modal-body">
							<p>
								Are you sure you want to delete
								<strong id="delete-note-message"></strong>?
							</p>
							<div class="alert alert-danger">
								This action cannot be undone.
							</div>
						</div>
						<div class="modal-footer">
							<button
								type="submit"
								class="btn btn-secondary"
								data-bs-dismiss="modal">
								Delete Note
							</button>
						</div>
					</form>
				</div>
			</div>
		</div>

		<script type="text/javascript" src="/static/js/note.js"></script>
	</body>
</html>
