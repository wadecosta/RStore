<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <title>Merge PDFs</title>

    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/mergepdf.css">
</head>

<body>
	{{ template "Header" . }}
	<div class="container mt-4">
		<h1 class="mb-4">Merge PDFs</h1>

		<form id="mergeForm">
			<div class="mb-3">
				<input 
					type="file" 
					id="pdfs" 
					class="form-control" 
					multiple accept="application/pdf,.pdf" 
					required>
			</div>

			<div class="alert alert-info">
				Drag and drop the PDF cards below to change the merge order.
				The first PDF becomes page 1 of the merged document.
			</div>

			<div id="pdf-list" class="row g-3 mb-4"></div>

			<button type="submit" class="btn btn-primary">
				Merge PDFs
			</button>
		</form>
	</div>

	<script type="text/javascript" src="/static/js/mergepdf.js"></script>
</body>
</html>
